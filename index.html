<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Digital</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            background: #1a1a2e;
            font-family: 'Segoe UI', sans-serif;
            min-height: 100vh;
            color: white;
            padding: 10px;
        }
        
        .container { max-width: 600px; margin: 0 auto; }
        
        .header {
            background: linear-gradient(135deg, #16213e, #0f3460);
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            margin-bottom: 15px;
        }
        
        .tabs {
            display: flex;
            gap: 5px;
            margin-bottom: 10px;
            flex-wrap: wrap;
        }
        
        .tab {
            background: rgba(255,255,255,0.1);
            padding: 8px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
            border: 1px solid rgba(255,255,255,0.2);
        }
        .tab.active { background: #e94560; }
        
        .section {
            background: rgba(255,255,255,0.05);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 10px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        
        .section h3 { margin-bottom: 12px; color: #e94560; font-size: 16px; }
        
        .order-card {
            background: rgba(255,255,255,0.08);
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 8px;
        }
        
        .order-card .id { color: #f09433; font-weight: bold; font-size: 15px; }
        .order-card .info { font-size: 12px; color: #ccc; margin: 5px 0; }
        
        .btn {
            padding: 8px 15px;
            border-radius: 6px;
            border: none;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            margin: 3px;
            color: white;
        }
        .btn-deliver { background: #4CAF50; }
        .btn-cancel { background: #f44336; }
        .btn-status { background: #2196F3; }
        .btn-sms { background: #9C27B0; width: 100%; padding: 12px; font-size: 14px; margin-top: 5px; }
        .btn-add { background: #4CAF50; }
        .btn-cut { background: #FF9800; }
        .btn-block { background: #f44336; }
        .btn-unblock { background: #4CAF50; }
        
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background: #1a1a2e;
            border-radius: 15px;
            padding: 20px;
            width: 92%;
            max-width: 400px;
            max-height: 80vh;
            overflow-y: auto;
        }
        textarea, input, select {
            width: 100%;
            padding: 10px;
            margin: 5px 0;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.3);
            background: rgba(255,255,255,0.1);
            color: white;
            font-size: 13px;
        }
        select option { background: #1a1a2e; color: white; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>👑 এডমিন প্যানেল</h1>
            <p style="color:#aaa;font-size:12px;">Digital Center</p>
        </div>
        
        <div class="tabs">
            <div class="tab active" onclick="showTab('orders')">📋 অর্ডার</div>
            <div class="tab" onclick="showTab('balance')">💰 ব্যালেন্স</div>
            <div class="tab" onclick="showTab('users')">👥 ইউজার</div>
            <div class="tab" onclick="showTab('services')">⚙️ সার্ভিস</div>
            <div class="tab" onclick="showTab('broadcast')">📢 ব্রডকাস্ট</div>
        </div>
        
        <!-- অর্ডার ট্যাব -->
        <div id="tab-orders" class="section">
            <h3>📋 পেন্ডিং অর্ডার</h3>
            <div id="ordersList">লোড হচ্ছে...</div>
        </div>
        
        <!-- ব্যালেন্স ট্যাব -->
        <div id="tab-balance" class="section" style="display:none;">
            <h3>💰 ব্যালেন্স ম্যানেজ</h3>
            <input type="text" id="balanceUserId" placeholder="ইউজার ID">
            <input type="number" id="balanceAmount" placeholder="টাকার পরিমাণ">
            <button class="btn btn-add" onclick="addBalance()" style="width:48%;">➕ ব্যালেন্স এড</button>
            <button class="btn btn-cut" onclick="cutBalance()" style="width:48%;">➖ ব্যালেন্স কাটা</button>
        </div>
        
        <!-- ইউজার ট্যাব -->
        <div id="tab-users" class="section" style="display:none;">
            <h3>👥 ইউজার ম্যানেজ</h3>
            <input type="text" id="manageUserId" placeholder="ইউজার ID">
            <button class="btn btn-block" onclick="blockUser()" style="width:48%;">🚫 ব্লক</button>
            <button class="btn btn-unblock" onclick="unblockUser()" style="width:48%;">🔓 আনব্লক</button>
        </div>
        
        <!-- সার্ভিস ট্যাব -->
        <div id="tab-services" class="section" style="display:none;">
            <h3>⚙️ সার্ভিস ম্যানেজ</h3>
            <select id="serviceSelect">
                <option value="">সার্ভিস সিলেক্ট করুন</option>
                <option value="s1">NID কার্ড PDF</option>
                <option value="s2">স্মার্ট কার্ড PDF</option>
                <option value="s3">সার্ভার কপি</option>
                <option value="s4">হারানো এনআইডি</option>
                <option value="s5">Nid সংশোধন কপি</option>
                <option value="s6">Passport SB Copy</option>
                <option value="s7">ই-টিন সার্টিফিকেট</option>
                <option value="s8">নম্বর টু লোকেশন</option>
                <option value="s9">সিম মালিকানা তথ্য</option>
            </select>
            <input type="number" id="newPrice" placeholder="নতুন দাম">
            <select id="serviceStatus">
                <option value="ON">চালু (ON)</option>
                <option value="OFF">বন্ধ (OFF)</option>
            </select>
            <button class="btn btn-status" onclick="updateService()" style="width:100%;">✅ সার্ভিস আপডেট</button>
        </div>
        
        <!-- ব্রডকাস্ট ট্যাব -->
        <div id="tab-broadcast" class="section" style="display:none;">
            <h3>📢 ব্রডকাস্ট</h3>
            <textarea id="broadcastMsg" placeholder="সকল ইউজারকে মেসেজ লিখুন..." rows="4"></textarea>
            <button class="btn btn-sms" onclick="sendBroadcast()">📢 সবার কাছে পাঠান</button>
        </div>
        
        <button class="btn btn-sms" style="background:#FF9800;margin-top:10px;" onclick="location.reload()">🔄 রিফ্রেশ</button>
    </div>
    
    <!-- ডেলিভারি মডাল -->
    <div class="modal" id="deliverModal">
        <div class="modal-content">
            <h3>📥 ডেলিভারি</h3>
            <p id="deliverOrderId" style="color:#f09433;"></p>
            <textarea id="deliverText" placeholder="ডেলিভারি মেসেজ (অপশনাল)..." rows="3"></textarea>
            <button class="btn btn-deliver" onclick="confirmDeliver()" style="width:100%;margin-top:10px;">✅ ডেলিভারি সম্পন্ন</button>
            <button class="btn btn-cancel" onclick="closeModal('deliverModal')" style="width:100%;">❌ বন্ধ</button>
        </div>
    </div>
    
    <!-- বাতিল মডাল -->
    <div class="modal" id="cancelModal">
        <div class="modal-content">
            <h3>❌ অর্ডার বাতিল</h3>
            <p id="cancelOrderId" style="color:#f09433;"></p>
            <textarea id="cancelReason" placeholder="বাতিলের কারণ লিখুন..." rows="3"></textarea>
            <button class="btn btn-cancel" onclick="confirmCancel()" style="width:100%;margin-top:10px;">❌ বাতিল করুন</button>
            <button class="btn" onclick="closeModal('cancelModal')" style="width:100%;background:rgba(255,255,255,0.1);">বন্ধ</button>
        </div>
    </div>
    
    <!-- স্ট্যাটাস মডাল -->
    <div class="modal" id="statusModal">
        <div class="modal-content">
            <h3>📊 স্ট্যাটাস আপডেট</h3>
            <p id="statusOrderId" style="color:#f09433;"></p>
            <input type="range" id="statusRange" min="1" max="100" value="50" style="width:100%;">
            <p style="text-align:center;font-size:20px;font-weight:bold;" id="statusValue">50%</p>
            <button class="btn btn-status" onclick="confirmStatus()" style="width:100%;">✅ আপডেট</button>
            <button class="btn" onclick="closeModal('statusModal')" style="width:100%;background:rgba(255,255,255,0.1);">বন্ধ</button>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.ready();
        
        const API_URL = 'https://YOUR_GMS_BOT_URL.com';
        let currentOrderId = null;
        
        // ট্যাব সুইচ
        function showTab(tab) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            event.target.classList.add('active');
            
            ['orders', 'balance', 'users', 'services', 'broadcast'].forEach(t => {
                document.getElementById(`tab-${t}`).style.display = t === tab ? 'block' : 'none';
            });
            
            if (tab === 'orders') loadOrders();
        }
        
        // মডাল
        function openModal(id) { document.getElementById(id).style.display = 'flex'; }
        function closeModal(id) { document.getElementById(id).style.display = 'none'; }
        
        // লোড অর্ডার
        function loadOrders() {
            fetch(`${API_URL}/api/orders/active`)
                .then(r => r.json())
                .then(data => {
                    const div = document.getElementById('ordersList');
                    const orders = Object.values(data);
                    
                    if (orders.length === 0) {
                        div.innerHTML = '<p style="color:#aaa;text-align:center;">কোনো পেন্ডিং অর্ডার নেই</p>';
                        return;
                    }
                    
                    div.innerHTML = orders.map(o => `
                        <div class="order-card">
                            <div class="id">🆔 #${o.order_id}</div>
                            <div class="info">👤 ${o.user_name} | 📱 ${o.user_phone}</div>
                            <div class="info">📦 ${o.service} | 💰 ${o.price} টাকা | 📊 ${o.percentage}%</div>
                            <div class="info" style="color:#aaa;">${o.info.replace(/\n/g, '<br>')}</div>
                            <div style="margin-top:8px;">
                                <button class="btn btn-deliver" onclick="openDeliver('${o.order_id}')">📥 ডেলিভারি</button>
                                <button class="btn btn-status" onclick="openStatus('${o.order_id}', ${o.percentage})">📊 স্ট্যাটাস</button>
                                <button class="btn btn-cancel" onclick="openCancel('${o.order_id}')">❌ বাতিল</button>
                            </div>
                        </div>
                    `).join('');
                })
                .catch(() => {
                    document.getElementById('ordersList').innerHTML = '<p style="color:red;">লোড করতে সমস্যা</p>';
                });
        }
        
        loadOrders();
        setInterval(loadOrders, 10000);
        
        // ডেলিভারি
        function openDeliver(orderId) {
            currentOrderId = orderId;
            document.getElementById('deliverOrderId').textContent = `অর্ডার: #${orderId}`;
            openModal('deliverModal');
        }
        function confirmDeliver() {
            const text = document.getElementById('deliverText').value;
            tg.sendData(JSON.stringify({ action: 'deliver', order_id: currentOrderId, type: 'text', text: text }));
            closeModal('deliverModal');
            document.getElementById('deliverText').value = '';
            setTimeout(loadOrders, 2000);
        }
        
        // বাতিল
        function openCancel(orderId) {
            currentOrderId = orderId;
            document.getElementById('cancelOrderId').textContent = `অর্ডার: #${orderId}`;
            openModal('cancelModal');
        }
        function confirmCancel() {
            const reason = document.getElementById('cancelReason').value || 'কোনো কারণ উল্লেখ করা হয়নি';
            tg.sendData(JSON.stringify({ action: 'cancel', order_id: currentOrderId, reason: reason }));
            closeModal('cancelModal');
            document.getElementById('cancelReason').value = '';
            setTimeout(loadOrders, 2000);
        }
        
        // স্ট্যাটাস
        function openStatus(orderId, currentPct) {
            currentOrderId = orderId;
            document.getElementById('statusOrderId').textContent = `অর্ডার: #${orderId}`;
            document.getElementById('statusRange').value = currentPct;
            document.getElementById('statusValue').textContent = currentPct + '%';
            openModal('statusModal');
        }
        document.getElementById('statusRange').addEventListener('input', function() {
            document.getElementById('statusValue').textContent = this.value + '%';
        });
        function confirmStatus() {
            const pct = document.getElementById('statusRange').value;
            tg.sendData(JSON.stringify({ action: 'update_status', order_id: currentOrderId, percentage: parseInt(pct) }));
            closeModal('statusModal');
            setTimeout(loadOrders, 2000);
        }
        
        // ব্যালেন্স
        function addBalance() {
            const uid = document.getElementById('balanceUserId').value;
            const amount = document.getElementById('balanceAmount').value;
            if (!uid || !amount) { tg.showPopup({ title: '⚠️', message: 'ID ও টাকা দিন!' }); return; }
            tg.sendData(JSON.stringify({ action: 'add_balance', user_id: uid, amount: parseInt(amount) }));
            document.getElementById('balanceUserId').value = '';
            document.getElementById('balanceAmount').value = '';
            tg.showPopup({ title: '✅', message: 'ব্যালেন্স এড হয়েছে!' });
        }
        function cutBalance() {
            const uid = document.getElementById('balanceUserId').value;
            const amount = document.getElementById('balanceAmount').value;
            if (!uid || !amount) { tg.showPopup({ title: '⚠️', message: 'ID ও টাকা দিন!' }); return; }
            tg.sendData(JSON.stringify({ action: 'cut_balance', user_id: uid, amount: parseInt(amount) }));
            document.getElementById('balanceUserId').value = '';
            document.getElementById('balanceAmount').value = '';
            tg.showPopup({ title: '✅', message: 'ব্যালেন্স কাটা হয়েছে!' });
        }
        
        // ইউজার
        function blockUser() {
            const uid = document.getElementById('manageUserId').value;
            if (!uid) { tg.showPopup({ title: '⚠️', message: 'ID দিন!' }); return; }
            tg.sendData(JSON.stringify({ action: 'block_user', user_id: uid }));
            document.getElementById('manageUserId').value = '';
            tg.showPopup({ title: '✅', message: 'ইউজার ব্লক হয়েছে!' });
        }
        function unblockUser() {
            const uid = document.getElementById('manageUserId').value;
            if (!uid) { tg.showPopup({ title: '⚠️', message: 'ID দিন!' }); return; }
            tg.sendData(JSON.stringify({ action: 'unblock_user', user_id: uid }));
            document.getElementById('manageUserId').value = '';
            tg.showPopup({ title: '✅', message: 'ইউজার আনব্লক হয়েছে!' });
        }
        
        // সার্ভিস
        function updateService() {
            const serviceId = document.getElementById('serviceSelect').value;
            const price = document.getElementById('newPrice').value;
            const status = document.getElementById('serviceStatus').value;
            if (!serviceId) { tg.showPopup({ title: '⚠️', message: 'সার্ভিস সিলেক্ট করুন!' }); return; }
            
            const data = { action: 'update_service', service_id: serviceId };
            if (price) data.price = price;
            if (status) data.status = status;
            
            tg.sendData(JSON.stringify(data));
            document.getElementById('newPrice').value = '';
            tg.showPopup({ title: '✅', message: 'সার্ভিস আপডেট হয়েছে!' });
        }
        
        // ব্রডকাস্ট
        function sendBroadcast() {
            const msg = document.getElementById('broadcastMsg').value;
            if (!msg.trim()) { tg.showPopup({ title: '⚠️', message: 'মেসেজ লিখুন!' }); return; }
            tg.sendData(JSON.stringify({ action: 'broadcast', message: msg }));
            document.getElementById('broadcastMsg').value = '';
            tg.showPopup({ title: '✅', message: 'ব্রডকাস্ট পাঠানো হয়েছে!' });
        }
    </script>
</body>
</html>
