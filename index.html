<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Digital Center</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #1a1a2e; font-family: 'Segoe UI', sans-serif; min-height: 100vh; color: white; padding: 10px; }
        .container { max-width: 600px; margin: 0 auto; }
        .header { background: linear-gradient(135deg, #16213e, #0f3460); border-radius: 15px; padding: 20px; text-align: center; margin-bottom: 15px; }
        .tabs { display: flex; gap: 5px; margin-bottom: 10px; flex-wrap: wrap; }
        .tab { background: rgba(255,255,255,0.1); padding: 8px 14px; border-radius: 8px; cursor: pointer; font-size: 12px; font-weight: bold; }
        .tab.active { background: #e94560; }
        .section { background: rgba(255,255,255,0.05); border-radius: 12px; padding: 15px; margin-bottom: 10px; }
        .section h3 { color: #e94560; margin-bottom: 12px; font-size: 16px; }
        .order-card { background: rgba(255,255,255,0.08); border-radius: 10px; padding: 12px; margin-bottom: 8px; }
        .order-card .id { color: #f09433; font-weight: bold; font-size: 15px; }
        .order-card .info { font-size: 12px; color: #ccc; margin: 5px 0; }
        .btn { padding: 8px 15px; border-radius: 6px; border: none; font-size: 12px; font-weight: bold; cursor: pointer; margin: 3px; color: white; }
        .btn-deliver { background: #4CAF50; } .btn-cancel { background: #f44336; } .btn-status { background: #2196F3; }
        .btn-sms { background: #9C27B0; width: 100%; padding: 12px; font-size: 14px; margin-top: 5px; }
        .btn-add { background: #4CAF50; } .btn-cut { background: #FF9800; }
        .btn-block { background: #f44336; } .btn-unblock { background: #4CAF50; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 1000; justify-content: center; align-items: center; }
        .modal-content { background: #1a1a2e; border-radius: 15px; padding: 20px; width: 92%; max-width: 400px; }
        textarea, input, select { width: 100%; padding: 10px; margin: 5px 0; border-radius: 8px; border: 1px solid rgba(255,255,255,0.3); background: rgba(255,255,255,0.1); color: white; font-size: 13px; }
        select option { background: #1a1a2e; color: white; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header"><h1>👑 এডমিন প্যানেল</h1><p style="color:#aaa;font-size:12px;">Digital Center</p></div>
        
        <div class="tabs">
            <div class="tab active" onclick="showTab('orders')">📋 অর্ডার</div>
            <div class="tab" onclick="showTab('balance')">💰 ব্যালেন্স</div>
            <div class="tab" onclick="showTab('users')">👥 ইউজার</div>
            <div class="tab" onclick="showTab('services')">⚙️ সার্ভিস</div>
            <div class="tab" onclick="showTab('broadcast')">📢 ব্রডকাস্ট</div>
        </div>
        
        <div id="tab-orders" class="section"><h3>📋 পেন্ডিং অর্ডার</h3><div id="ordersList">লোড হচ্ছে...</div></div>
        <div id="tab-balance" class="section" style="display:none;"><h3>💰 ব্যালেন্স</h3><input type="text" id="balanceUserId" placeholder="ইউজার ID"><input type="number" id="balanceAmount" placeholder="টাকা"><button class="btn btn-add" onclick="addBalance()" style="width:48%;">➕ এড</button><button class="btn btn-cut" onclick="cutBalance()" style="width:48%;">➖ কাটা</button></div>
        <div id="tab-users" class="section" style="display:none;"><h3>👥 ইউজার</h3><input type="text" id="manageUserId" placeholder="ইউজার ID"><button class="btn btn-block" onclick="blockUser()" style="width:48%;">🚫 ব্লক</button><button class="btn btn-unblock" onclick="unblockUser()" style="width:48%;">🔓 আনব্লক</button></div>
        <div id="tab-services" class="section" style="display:none;"><h3>⚙️ সার্ভিস</h3><select id="serviceSelect"><option value="">সিলেক্ট করুন</option><option value="s1">NID কার্ড PDF</option><option value="s2">স্মার্ট কার্ড PDF</option><option value="s3">সার্ভার কপি</option><option value="s4">হারানো এনআইডি</option><option value="s5">Nid সংশোধন কপি</option><option value="s6">Passport SB Copy</option><option value="s7">ই-টিন সার্টিফিকেট</option><option value="s8">নম্বর টু লোকেশন</option><option value="s9">সিম মালিকানা তথ্য</option></select><input type="number" id="newPrice" placeholder="নতুন দাম"><select id="serviceStatus"><option value="ON">ON</option><option value="OFF">OFF</option></select><button class="btn btn-status" onclick="updateService()" style="width:100%;">✅ আপডেট</button></div>
        <div id="tab-broadcast" class="section" style="display:none;"><h3>📢 ব্রডকাস্ট</h3><textarea id="broadcastMsg" placeholder="সকল ইউজারকে মেসেজ..." rows="4"></textarea><button class="btn btn-sms" onclick="sendBroadcast()">📢 পাঠান</button></div>
        
        <button class="btn btn-sms" style="background:#FF9800;margin-top:10px;" onclick="location.reload()">🔄 রিফ্রেশ</button>
    </div>
    
    <div class="modal" id="deliverModal"><div class="modal-content"><h3>📥 ডেলিভারি</h3><p id="deliverOrderId" style="color:#f09433;"></p><textarea id="deliverText" placeholder="ডেলিভারি মেসেজ (অপশনাল)..." rows="3"></textarea><button class="btn btn-deliver" onclick="confirmDeliver()" style="width:100%;margin-top:10px;">✅ ডেলিভারি সম্পন্ন</button><button class="btn btn-cancel" onclick="closeModal('deliverModal')" style="width:100%;">❌ বন্ধ</button></div></div>
    <div class="modal" id="cancelModal"><div class="modal-content"><h3>❌ অর্ডার বাতিল</h3><p id="cancelOrderId" style="color:#f09433;"></p><textarea id="cancelReason" placeholder="বাতিলের কারণ লিখুন..." rows="3"></textarea><button class="btn btn-cancel" onclick="confirmCancel()" style="width:100%;margin-top:10px;">❌ বাতিল করুন</button><button class="btn" onclick="closeModal('cancelModal')" style="width:100%;background:rgba(255,255,255,0.1);">বন্ধ</button></div></div>
    <div class="modal" id="statusModal"><div class="modal-content"><h3>📊 স্ট্যাটাস আপডেট</h3><p id="statusOrderId" style="color:#f09433;"></p><input type="range" id="statusRange" min="1" max="100" value="50" style="width:100%;"><p style="text-align:center;font-size:20px;font-weight:bold;" id="statusValue">50%</p><button class="btn btn-status" onclick="confirmStatus()" style="width:100%;">✅ আপডেট</button><button class="btn" onclick="closeModal('statusModal')" style="width:100%;background:rgba(255,255,255,0.1);">বন্ধ</button></div></div>

    <script>
        const tg = window.Telegram.WebApp; tg.expand(); tg.ready();
        const API_URL = 'https://sujonbot.pythonanywhere.com';
        let currentOrderId = null;
        
        function showTab(tab) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            event.target.classList.add('active');
            ['orders','balance','users','services','broadcast'].forEach(t => document.getElementById(`tab-${t}`).style.display = t === tab ? 'block' : 'none');
            if (tab === 'orders') loadOrders();
        }
        function openModal(id) { document.getElementById(id).style.display = 'flex'; }
        function closeModal(id) { document.getElementById(id).style.display = 'none'; }
        
        function loadOrders() {
            fetch(`${API_URL}/api/orders/active`).then(r => r.json()).then(data => {
                const orders = Object.values(data);
                const div = document.getElementById('ordersList');
                if (orders.length === 0) { div.innerHTML = '<p style="color:#aaa;text-align:center;">কোনো পেন্ডিং অর্ডার নেই</p>'; return; }
                div.innerHTML = orders.map(o => `<div class="order-card"><div class="id">🆔 #${o.order_id}</div><div class="info">👤 ${o.user_name} | 📱 ${o.user_phone}</div><div class="info">📦 ${o.service} | 💰 ${o.price} টাকা | 📊 ${o.percentage}%</div><div class="info" style="color:#aaa;">${o.info.replace(/\n/g, '<br>')}</div><div style="margin-top:8px;"><button class="btn btn-deliver" onclick="openDeliver('${o.order_id}')">📥 ডেলিভারি</button><button class="btn btn-status" onclick="openStatus('${o.order_id}', ${o.percentage})">📊 স্ট্যাটাস</button><button class="btn btn-cancel" onclick="openCancel('${o.order_id}')">❌ বাতিল</button></div></div>`).join('');
            });
        }
        loadOrders(); setInterval(loadOrders, 10000);
        
        function openDeliver(oid) { currentOrderId = oid; document.getElementById('deliverOrderId').textContent = `অর্ডার: #${oid}`; openModal('deliverModal'); }
        function confirmDeliver() { tg.sendData(JSON.stringify({ action: 'deliver', order_id: currentOrderId, text: document.getElementById('deliverText').value })); closeModal('deliverModal'); document.getElementById('deliverText').value = ''; setTimeout(loadOrders, 2000); }
        function openCancel(oid) { currentOrderId = oid; document.getElementById('cancelOrderId').textContent = `অর্ডার: #${oid}`; openModal('cancelModal'); }
        function confirmCancel() { tg.sendData(JSON.stringify({ action: 'cancel', order_id: currentOrderId, reason: document.getElementById('cancelReason').value || 'N/A' })); closeModal('cancelModal'); document.getElementById('cancelReason').value = ''; setTimeout(loadOrders, 2000); }
        function openStatus(oid, pct) { currentOrderId = oid; document.getElementById('statusOrderId').textContent = `অর্ডার: #${oid}`; document.getElementById('statusRange').value = pct; document.getElementById('statusValue').textContent = pct + '%'; openModal('statusModal'); }
        function confirmStatus() { tg.sendData(JSON.stringify({ action: 'update_status', order_id: currentOrderId, percentage: parseInt(document.getElementById('statusRange').value) })); closeModal('statusModal'); setTimeout(loadOrders, 2000); }
        document.getElementById('statusRange').addEventListener('input', function() { document.getElementById('statusValue').textContent = this.value + '%'; });
        
        function addBalance() { const u=document.getElementById('balanceUserId').value, a=document.getElementById('balanceAmount').value; if(!u||!a)return; tg.sendData(JSON.stringify({action:'add_balance',user_id:u,amount:parseInt(a)})); document.getElementById('balanceUserId').value=''; document.getElementById('balanceAmount').value=''; tg.showPopup({title:'✅',message:'ব্যালেন্স এড!'}); }
        function cutBalance() { const u=document.getElementById('balanceUserId').value, a=document.getElementById('balanceAmount').value; if(!u||!a)return; tg.sendData(JSON.stringify({action:'cut_balance',user_id:u,amount:parseInt(a)})); document.getElementById('balanceUserId').value=''; document.getElementById('balanceAmount').value=''; tg.showPopup({title:'✅',message:'ব্যালেন্স কাটা!'}); }
        function blockUser() { const u=document.getElementById('manageUserId').value; if(!u)return; tg.sendData(JSON.stringify({action:'block_user',user_id:u})); document.getElementById('manageUserId').value=''; tg.showPopup({title:'✅',message:'ব্লক!'}); }
        function unblockUser() { const u=document.getElementById('manageUserId').value; if(!u)return; tg.sendData(JSON.stringify({action:'unblock_user',user_id:u})); document.getElementById('manageUserId').value=''; tg.showPopup({title:'✅',message:'আনব্লক!'}); }
        function updateService() { const s=document.getElementById('serviceSelect').value; if(!s)return; const d={action:'update_service',service_id:s}; const p=document.getElementById('newPrice').value; if(p)d.price=p; d.status=document.getElementById('serviceStatus').value; tg.sendData(JSON.stringify(d)); tg.showPopup({title:'✅',message:'সার্ভিস আপডেট!'}); }
        function sendBroadcast() { const m=document.getElementById('broadcastMsg').value; if(!m.trim())return; tg.sendData(JSON.stringify({action:'broadcast',message:m})); document.getElementById('broadcastMsg').value=''; tg.showPopup({title:'✅',message:'ব্রডকাস্ট পাঠানো হয়েছে!'}); }
    </script>
</body>
</html>
