<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Digital</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            background: #1a1a2e;
            font-family: 'Segoe UI', sans-serif;
            min-height: 100vh;
            color: white;
            padding: 10px;
        }
        
        .container { max-width: 600px; margin: 0 auto; }
        
        .header {
            background: linear-gradient(135deg, #16213e, #0f3460);
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            margin-bottom: 15px;
        }
        
        .section {
            background: rgba(255,255,255,0.05);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 10px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        
        .section h3 {
            margin-bottom: 12px;
            color: #e94560;
            font-size: 16px;
        }
        
        .order-card {
            background: rgba(255,255,255,0.08);
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 8px;
        }
        
        .order-card .id { color: #f09433; font-weight: bold; font-size: 15px; }
        .order-card .info { font-size: 12px; color: #ccc; margin: 5px 0; }
        
        .btn {
            padding: 8px 15px;
            border-radius: 6px;
            border: none;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            margin: 3px;
            color: white;
        }
        .btn-deliver { background: #4CAF50; }
        .btn-cancel { background: #f44336; }
        .btn-status { background: #2196F3; }
        .btn-sms { background: #9C27B0; width: 100%; padding: 12px; font-size: 14px; margin-top: 5px; }
        
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background: #1a1a2e;
            border-radius: 15px;
            padding: 20px;
            width: 92%;
            max-width: 400px;
        }
        textarea, input {
            width: 100%;
            padding: 10px;
            margin: 5px 0;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.3);
            background: rgba(255,255,255,0.1);
            color: white;
            font-size: 13px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>👑 এডমিন প্যানেল</h1>
            <p style="color:#aaa;font-size:12px;">Sujon Services</p>
        </div>
        
        <div class="section">
            <h3>📋 পেন্ডিং অর্ডার</h3>
            <div id="ordersList">লোড হচ্ছে...</div>
        </div>
        
        <div class="section">
            <h3>📢 ব্রডকাস্ট</h3>
            <textarea id="broadcastMsg" placeholder="সকল ইউজারকে মেসেজ লিখুন..." rows="3"></textarea>
            <button class="btn btn-sms" onclick="sendBroadcast()">📢 সবার কাছে পাঠান</button>
        </div>
        
        <button class="btn btn-sms" style="background:#FF9800;margin-top:10px;" onclick="location.reload()">🔄 রিফ্রেশ</button>
    </div>
    
    <div class="modal" id="deliverModal">
        <div class="modal-content">
            <h3>📥 ডেলিভারি</h3>
            <p id="deliverOrderId" style="color:#f09433;"></p>
            <textarea id="deliverText" placeholder="ডেলিভারি মেসেজ (অপশনাল)..." rows="3"></textarea>
            <button class="btn btn-deliver" onclick="confirmDeliver()" style="width:100%;margin-top:10px;">✅ ডেলিভারি</button>
            <button class="btn btn-cancel" onclick="closeDeliverModal()" style="width:100%;">❌ বন্ধ</button>
        </div>
    </div>
    
    <div class="modal" id="cancelModal">
        <div class="modal-content">
            <h3>❌ অর্ডার বাতিল</h3>
            <p id="cancelOrderId" style="color:#f09433;"></p>
            <textarea id="cancelReason" placeholder="বাতিলের কারণ..." rows="3"></textarea>
            <button class="btn btn-cancel" onclick="confirmCancel()" style="width:100%;margin-top:10px;">❌ বাতিল</button>
            <button class="btn" onclick="closeCancelModal()" style="width:100%;background:rgba(255,255,255,0.1);">বন্ধ</button>
        </div>
    </div>
    
    <div class="modal" id="statusModal">
        <div class="modal-content">
            <h3>📊 স্ট্যাটাস</h3>
            <p id="statusOrderId" style="color:#f09433;"></p>
            <input type="range" id="statusRange" min="1" max="100" value="50" style="width:100%;">
            <p style="text-align:center;font-size:20px;" id="statusValue">50%</p>
            <button class="btn btn-status" onclick="confirmStatus()" style="width:100%;">✅ আপডেট</button>
            <button class="btn" onclick="closeStatusModal()" style="width:100%;background:rgba(255,255,255,0.1);">বন্ধ</button>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.ready();
        
        const API_URL = 'https://your-gms-bot-url.com';
        let currentOrderId = null;
        
        function loadOrders() {
            fetch(`${API_URL}/api/orders/active`)
                .then(r => r.json())
                .then(data => {
                    const div = document.getElementById('ordersList');
                    const orders = Object.values(data);
                    
                    if (orders.length === 0) {
                        div.innerHTML = '<p style="color:#aaa;text-align:center;">কোনো পেন্ডিং অর্ডার নেই</p>';
                        return;
                    }
                    
                    div.innerHTML = orders.map(o => `
                        <div class="order-card">
                            <div class="id">🆔 #${o.order_id}</div>
                            <div class="info">👤 ${o.user_name} | 📱 ${o.user_phone}</div>
                            <div class="info">📦 ${o.service} | 💰 ${o.price} টাকা | 📊 ${o.percentage}%</div>
                            <div class="info" style="color:#aaa;">${o.info.replace(/\n/g, '<br>')}</div>
                            <div style="margin-top:8px;">
                                <button class="btn btn-deliver" onclick="openDeliver('${o.order_id}')">📥 ডেলিভারি</button>
                                <button class="btn btn-status" onclick="openStatus('${o.order_id}', ${o.percentage})">📊 স্ট্যাটাস</button>
                                <button class="btn btn-cancel" onclick="openCancel('${o.order_id}')">❌ বাতিল</button>
                            </div>
                        </div>
                    `).join('');
                })
                .catch(() => {
                    document.getElementById('ordersList').innerHTML = '<p style="color:red;">লোড করতে সমস্যা</p>';
                });
        }
        
        loadOrders();
        setInterval(loadOrders, 10000);
        
        function openDeliver(orderId) {
            currentOrderId = orderId;
            document.getElementById('deliverOrderId').textContent = `অর্ডার: #${orderId}`;
            document.getElementById('deliverModal').style.display = 'flex';
        }
        function closeDeliverModal() {
            document.getElementById('deliverModal').style.display = 'none';
            document.getElementById('deliverText').value = '';
        }
        function confirmDeliver() {
            const text = document.getElementById('deliverText').value;
            tg.sendData(JSON.stringify({
                action: 'deliver',
                order_id: currentOrderId,
                type: 'text',
                text: text
            }));
            closeDeliverModal();
            setTimeout(loadOrders, 2000);
        }
        
        function openCancel(orderId) {
            currentOrderId = orderId;
            document.getElementById('cancelOrderId').textContent = `অর্ডার: #${orderId}`;
            document.getElementById('cancelModal').style.display = 'flex';
        }
        function closeCancelModal() {
            document.getElementById('cancelModal').style.display = 'none';
            document.getElementById('cancelReason').value = '';
        }
        function confirmCancel() {
            const reason = document.getElementById('cancelReason').value || 'কোনো কারণ উল্লেখ করা হয়নি';
            tg.sendData(JSON.stringify({
                action: 'cancel',
                order_id: currentOrderId,
                reason: reason
            }));
            closeCancelModal();
            setTimeout(loadOrders, 2000);
        }
        
        function openStatus(orderId, currentPct) {
            currentOrderId = orderId;
            document.getElementById('statusOrderId').textContent = `অর্ডার: #${orderId}`;
            document.getElementById('statusRange').value = currentPct;
            document.getElementById('statusValue').textContent = currentPct + '%';
            document.getElementById('statusModal').style.display = 'flex';
        }
        function closeStatusModal() { document.getElementById('statusModal').style.display = 'none'; }
        document.getElementById('statusRange').addEventListener('input', function() {
            document.getElementById('statusValue').textContent = this.value + '%';
        });
        function confirmStatus() {
            const pct = document.getElementById('statusRange').value;
            tg.sendData(JSON.stringify({
                action: 'update_status',
                order_id: currentOrderId,
                percentage: parseInt(pct)
            }));
            closeStatusModal();
            setTimeout(loadOrders, 2000);
        }
        
        function sendBroadcast() {
            const msg = document.getElementById('broadcastMsg').value;
            if (!msg.trim()) {
                tg.showPopup({ title: '⚠️', message: 'মেসেজ লিখুন!' });
                return;
            }
            tg.sendData(JSON.stringify({
                action: 'broadcast',
                message: msg
            }));
            document.getElementById('broadcastMsg').value = '';
            tg.showPopup({ title: '✅', message: 'ব্রডকাস্ট পাঠানো হয়েছে!' });
        }
    </script>
</body>
</html>
